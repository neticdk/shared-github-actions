# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
---
name: Container Continuous Delivery

on:
  workflow_call:
    secrets:
      # Build secrets in the `id=value` form of docker/build-push-action, one
      # per line, such as a token a Dockerfile needs to fetch private Go
      # modules. Mounted with `RUN --mount=type=secret,id=...`.
      build-secrets:
        required: false
    inputs:
      image:
        description: "The image to push, without a tag. Defaults to ghcr.io/<owner>/<repository>."
        required: false
        type: string
      tags:
        description: >-
          Tags to push, one per line. Defaults to the Git ref name, plus
          `latest` when the ref is a tag without a pre-release suffix.
        required: false
        type: string
      context:
        description: "The build context"
        required: false
        type: string
        default: .
      file:
        description: "The Dockerfile, relative to the repository root"
        required: false
        type: string
        default: Dockerfile
      target:
        description: "The Dockerfile stage to build"
        required: false
        type: string
      platforms:
        description: "The platforms to build for"
        required: false
        type: string
        default: linux/amd64,linux/arm64
      build-args:
        description: "Build arguments, one `NAME=value` per line"
        required: false
        type: string
      sbom:
        description: "Attach an SBOM generated by BuildKit to the image"
        required: false
        type: boolean
        default: false
      sign:
        description: "Sign the image with cosign, keyless, in addition to the provenance"
        required: false
        type: boolean
        default: true
      runs-on:
        description: "The runner for the build job. The provenance job always runs on ubuntu-latest."
        required: false
        type: string
        default: ubuntu-latest
    outputs:
      image:
        description: "The image that was pushed, without a tag"
        value: ${{ jobs.build.outputs.image }}
      digest:
        description: "The digest of the pushed image"
        value: ${{ jobs.build.outputs.digest }}

jobs:
  # The build job runs the project's Dockerfile and is never given an OIDC
  # token, so nothing in the build can sign a statement about its own output.
  # The provenance job receives only the digest and is the only one that can
  # sign. This separation is what SLSA Build L3 asks of the build platform.
  build:
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Resolve image and tags
        id: ref
        env:
          IMAGE: ${{ inputs.image }}
          TAGS: ${{ inputs.tags }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          image="${IMAGE:-ghcr.io/${REPOSITORY,,}}"
          if [[ -z "${TAGS}" ]]; then
            TAGS="${REF_NAME//\//-}"
            if [[ "${REF_TYPE}" == "tag" && "${REF_NAME}" != *-* ]]; then
              TAGS+=$'\n'latest
            fi
          fi
          {
            echo "image=${image}"
            echo "tags<<EOF"
            while IFS= read -r tag; do
              [[ -n "${tag}" ]] && echo "${image}:${tag}"
            done <<< "${TAGS}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to the Docker registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          target: ${{ inputs.target }}
          platforms: ${{ inputs.platforms }}
          build-args: ${{ inputs.build-args }}
          secrets: ${{ secrets.build-secrets }}
          tags: ${{ steps.ref.outputs.tags }}
          push: true
          sbom: ${{ inputs.sbom }}
          # BuildKit's own provenance is unsigned and written by the build it
          # describes. The signed provenance comes from the job below.
          provenance: false
          # No cache: a release is built from scratch, so that nothing a
          # previous run stored can end up in it.
          no-cache: true

  provenance:
    name: Provenance for ${{ needs.build.outputs.image }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      packages: write
      contents: read
    steps:
      - name: Log in to the Docker registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ needs.build.outputs.image }}
          subject-digest: ${{ needs.build.outputs.digest }}
          # Stored beside the image as well, so a cluster can verify it at
          # admission without asking the GitHub API.
          push-to-registry: true
          # A storage record needs artifact-metadata: write, which every
          # caller would then have to grant. The attestation does not.
          create-storage-record: false

      - name: Install cosign
        if: inputs.sign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: "v3.1.4"

      - name: Sign the image
        if: inputs.sign
        env:
          REF: ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}
        run: cosign sign --yes "${REF}"
