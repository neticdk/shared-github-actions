# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
---
name: Go Continuous Delivery

on:
  workflow_call:
    secrets:
      # gh_username and gh_password are needed if `go get` (driven by
      # `GOPRIVATE`) needs to clone private GitHub repositories using HTTPS,
      # and the default `GITHUB_TOKEN` doesn't have sufficient permissions.
      gh_username:
        required: false
      gh_token:
        required: false
      # The token used to push the Homebrew formula to the private repository.
      homebrew_token:
        required: false
      # satisfy actionlint
      GH_NETIC_ROBOT_CLASSIC_TOKEN:
        required: false
    inputs:
      runs-on:
        description: "The runner to use"
        required: false
        type: string
        default: ubuntu-latest
      go-version:
        description: "The version of Go to use"
        required: false
        type: string
      go-private:
        description: "The GOPRIVATE environment variable"
        required: false
        type: string
        default: github.com/containdk,github.com/neticdk,github.com/neticdk-k8s
      workdir:
        description: "The working directory for the release process"
        required: false
        type: string
        default: .
      run-docker-setup:
        description: >-
          Log in to ghcr.io and set up QEMU and Buildx. Needed only when the
          GoReleaser config builds container images; a release that only
          produces binaries does not use any of it, and requiring a Docker
          daemon rules out runners that have none.
        required: false
        default: true
        type: boolean
      run-free-disk-space:
        description: "Free disk space on Ubuntu runner"
        required: false
        default: false
        type: boolean

jobs:
  release:
    env:
      GOPRIVATE: "${{ inputs.go-private }}"
      GOEXPERIMENT: jsonv2
      GH_USERNAME: ${{ secrets.gh_username || 'gh-netic-robot' }}
      GH_TOKEN: ${{ secrets.gh_token || secrets.GH_NETIC_ROBOT_CLASSIC_TOKEN }}
      HOMEBREW_TOKEN: ${{ secrets.homebrew_token || secrets.GH_NETIC_ROBOT_CLASSIC_TOKEN }}
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Free Disk Space (Ubuntu)
        if: inputs.run-free-disk-space
        uses: neticdk/gh-free-disk-space-ubuntu@4b713b54c3cbe00fe80821b1ad45d1c715904daf # v1

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          # go-version takes precedence over go-version-file
          # if it is empty, go-version-file will be used
          go-version: ${{ inputs.go-version }}
          go-version-file: ${{ inputs.workdir }}/go.mod
          # Without this the cache lookup starts at the repository root, which
          # in a monorepo has no go.mod, and nothing is ever cached.
          cache-dependency-path: ${{ inputs.workdir }}/go.sum

      - name: Setup private repository access
        uses: $/.github/actions/setup-private-git
        with:
          go-private: ${{ inputs.go-private }}
          gh-username: ${{ env.GH_USERNAME }}
          gh-token: ${{ env.GH_TOKEN }}

      - name: Log in to the Docker registry
        if: inputs.run-docker-setup
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Add support for more platforms with QEMU (optional)
      # https://github.com/docker/setup-qemu-action
      - name: Set up QEMU
        if: inputs.run-docker-setup
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        if: inputs.run-docker-setup
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          driver: docker-container

      - name: Run GoReleaser Release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --verbose
          workdir: ${{ inputs.workdir }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TOKEN: ${{ env.HOMEBREW_TOKEN }}
