# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
---
name: Go Continuous Delivery

on:
  workflow_call:
    secrets:
      # gh_username and gh_password are needed if `go get` (driven by
      # `GOPRIVATE`) needs to clone private GitHub repositories using HTTPS,
      # and the default `GITHUB_TOKEN` doesn't have sufficient permissions.
      gh_username:
        required: false
      gh_token:
        required: false
      # The token used to push the Homebrew formula to the private repository.
      homebrew_token:
        required: false
      # satisfy actionlint
      GH_NETIC_ROBOT_CLASSIC_TOKEN:
        required: false
    inputs:
      runs-on:
        description: "The runner to use"
        required: false
        type: string
        default: ubuntu-latest
      go-version:
        description: "The version of Go to use"
        required: false
        type: string
      go-private:
        description: "The GOPRIVATE environment variable"
        required: false
        type: string
        default: github.com/containdk,github.com/neticdk,github.com/neticdk-k8s
      workdir:
        description: "The working directory for the release process"
        required: false
        type: string
        default: .
      run-docker-setup:
        description: >-
          Log in to ghcr.io and set up QEMU and Buildx. Needed only when the
          GoReleaser config builds container images; a release that only
          produces binaries does not use any of it, and requiring a Docker
          daemon rules out runners that have none.
        required: false
        default: true
        type: boolean
      run-free-disk-space:
        description: "Free disk space on Ubuntu runner"
        required: false
        default: false
        type: boolean

jobs:
  # The release job runs the project's own build: its GoReleaser config, hooks
  # and Dockerfiles. It is therefore never given an OIDC token, so nothing it
  # runs can sign a statement about its own output. The provenance jobs below
  # receive only the digests it reports, and are the only ones that can sign.
  # This separation is what SLSA Build L3 asks of the build platform.
  release:
    permissions:
      contents: write
      packages: write
    outputs:
      checksums: ${{ steps.subjects.outputs.checksums }}
      images: ${{ steps.subjects.outputs.images }}
    env:
      GOPRIVATE: "${{ inputs.go-private }}"
      GOEXPERIMENT: jsonv2
      GH_USERNAME: ${{ secrets.gh_username || 'gh-netic-robot' }}
      GH_TOKEN: ${{ secrets.gh_token || secrets.GH_NETIC_ROBOT_CLASSIC_TOKEN }}
      HOMEBREW_TOKEN: ${{ secrets.homebrew_token || secrets.GH_NETIC_ROBOT_CLASSIC_TOKEN }}
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Free Disk Space (Ubuntu)
        if: inputs.run-free-disk-space
        uses: neticdk/gh-free-disk-space-ubuntu@4b713b54c3cbe00fe80821b1ad45d1c715904daf # v1

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          # go-version takes precedence over go-version-file
          # if it is empty, go-version-file will be used
          go-version: ${{ inputs.go-version }}
          go-version-file: ${{ inputs.workdir }}/go.mod
          # Without this the cache lookup starts at the repository root, which
          # in a monorepo has no go.mod, and nothing is ever cached.
          cache-dependency-path: ${{ inputs.workdir }}/go.sum
          # A release is built from a clean module cache, so that nothing a
          # previous run stored can end up in the released artifacts.
          cache: false

      - name: Setup private repository access
        uses: $/.github/actions/setup-private-git
        with:
          go-private: ${{ inputs.go-private }}
          gh-username: ${{ env.GH_USERNAME }}
          gh-token: ${{ env.GH_TOKEN }}

      - name: Log in to the Docker registry
        if: inputs.run-docker-setup
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Add support for more platforms with QEMU (optional)
      # https://github.com/docker/setup-qemu-action
      - name: Set up QEMU
        if: inputs.run-docker-setup
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        if: inputs.run-docker-setup
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          driver: docker-container

      - name: Run GoReleaser Release
        id: goreleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --verbose
          workdir: ${{ inputs.workdir }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TOKEN: ${{ env.HOMEBREW_TOKEN }}

      # The subjects of the provenance: the checksums file GoReleaser writes
      # for the archives and binaries it uploads, and the digest of every
      # image it pushed. A release without a checksums file or images gets no
      # provenance for that kind of artifact.
      - name: Collect provenance subjects
        id: subjects
        env:
          ARTIFACTS: ${{ steps.goreleaser.outputs.artifacts }}
          WORKDIR: ${{ inputs.workdir }}
        run: |
          set -euo pipefail
          checksums=$(jq -r '[.[] | select(.type == "Checksum") | .path] | first // empty' <<< "${ARTIFACTS}")
          if [[ -n "${checksums}" ]]; then
            echo "checksums=$(base64 -w0 < "${WORKDIR}/${checksums}")" >> "$GITHUB_OUTPUT"
          fi
          images=$(jq -c '[.[]
            | select(.type == "Docker Image" or .type == "Published Docker Image" or .type == "Docker Manifest")
            | select((.extra.Digest // "") != "")
            | {name: (.name | sub(":[^:/]+$"; "")), digest: .extra.Digest}] | unique' <<< "${ARTIFACTS}")
          echo "images=${images}" >> "$GITHUB_OUTPUT"
          echo "Images: ${images}"

  provenance-files:
    name: Provenance for release files
    needs: release
    if: needs.release.outputs.checksums != ''
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - name: Restore the checksums file
        env:
          CHECKSUMS: ${{ needs.release.outputs.checksums }}
        run: base64 -d <<< "${CHECKSUMS}" > "${RUNNER_TEMP}/checksums.txt"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/checksums.txt
          create-storage-record: false

  provenance-images:
    name: Provenance for ${{ matrix.image.name }}
    needs: release
    if: needs.release.outputs.images != '' && needs.release.outputs.images != '[]'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      packages: write
      contents: read
    strategy:
      matrix:
        image: ${{ fromJSON(needs.release.outputs.images) }}
    steps:
      - name: Log in to the Docker registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ matrix.image.name }}
          subject-digest: ${{ matrix.image.digest }}
          # Stored beside the image as well, so a cluster can verify it at
          # admission without asking the GitHub API.
          push-to-registry: true
          # A storage record needs artifact-metadata: write, which every
          # caller would then have to grant. The attestation does not.
          create-storage-record: false
